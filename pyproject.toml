[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "token-distiller"
version = "0.1.4"
description = "Distills PDFs, photos, and repos into token-efficient context for LLM agents. Local OCR reads embedded diagrams, not just text layers; content-hash caching collapses re-reads; BM25 retrieval bounds huge documents. Nothing is discarded — anything shortened expands back in full. 33x on a 25-page PDF, 97% on pytest output."
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
authors = [
    { name = "Sri PriYa N. Chen" },
]
requires-python = ">=3.11"
keywords = ["llm", "tokens", "context", "pdf", "ocr", "rag", "retrieval", "claude", "anthropic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: General",
]
dependencies = [
    "pdfplumber>=0.11",
    "pypdf>=4.0",
    "pdf2image>=1.17",
    "pytesseract>=0.3.10",
    "pillow>=10.0",
    "pillow-heif>=0.15",
    "anthropic>=0.40",
    "rank-bm25>=0.2",
    "pathspec>=0.12",
]

[project.optional-dependencies]
rag-semantic = ["voyageai>=0.3"]
dev = ["pytest>=8", "pytest-mock", "httpx"]

[project.scripts]
distill = "token_distiller.cli:main"

[project.urls]
Homepage = "https://github.com/priyanchen/token-distiller"
Repository = "https://github.com/priyanchen/token-distiller"
Issues = "https://github.com/priyanchen/token-distiller/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/token_distiller"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/ is importable so test modules can share the PDF builder in conftest
pythonpath = ["."]
filterwarnings = ["ignore::UserWarning"]
markers = ["ocr: exercises the real Tesseract path (slow; deselected by default)"]
addopts = "-m 'not ocr'"
