[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "token-distiller"
version = "0.1.0"
description = "Distill PDFs, photos, and repos into token-efficient context for LLM agents, with local retrieval and activity-aware session auditing."
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
authors = [
    { name = "Sri PriYa N. Chen" },
]
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11",
    "pypdf>=4.0",
    "pdf2image>=1.17",
    "pytesseract>=0.3.10",
    "pillow>=10.0",
    "pillow-heif>=0.15",
    "anthropic>=0.40",
    "rank-bm25>=0.2",
    "pathspec>=0.12",
]

[project.optional-dependencies]
rag-semantic = ["voyageai>=0.3"]
dev = ["pytest>=8", "pytest-mock"]

[project.scripts]
distill = "token_distiller.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/token_distiller"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/ is importable so test modules can share the PDF builder in conftest
pythonpath = ["."]
filterwarnings = ["ignore::UserWarning"]
markers = ["ocr: exercises the real Tesseract path (slow; deselected by default)"]
addopts = "-m 'not ocr'"
